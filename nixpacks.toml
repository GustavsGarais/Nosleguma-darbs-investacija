[phases.install]
cmds = ['composer update --no-dev --optimize-autoloader', 'npm ci', 'npm run build']

[start]
cmd = 'mkdir -p /var/log/nginx && php artisan migrate --force && node /assets/scripts/prestart.mjs /assets/nginx.template.conf /etc/nginx.conf ; sed -i "/NIXPACKS_PHP_FALLBACK_PATH/,/^[[:space:]]*)/d" /etc/nginx.conf ; php-fpm -y /assets/php-fpm.conf -D && nginx -c /etc/nginx.conf'
